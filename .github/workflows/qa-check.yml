name: QA Data & Asset Check

on:
  push: 
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest # Chạy trên máy ảo Linux của GitHub
    steps:
    - name: Tải mã nguồn về máy ảo
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Chạy script Python kiểm tra định dạng file JSON
      run: |
        python -c "
        import json, glob, sys
        errors = 0
        
        # Quét tất cả file .json trong thư mục knowledge (và các thư mục con)
        files = glob.glob('knowledge/**/*.json', recursive=True)
        
        if not files:
            print('⚠️ Chưa tìm thấy file JSON nào trong thư mục knowledge/ để kiểm tra.')
        else:
            for f in files:
                try:
                    with open(f, encoding='utf-8') as file:
                        json.load(file)
                except Exception as e:
                    print(f'❌ LỖI: File {f} bị sai định dạng JSON. Chi tiết: {e}')
                    errors += 1
                    
        # Nếu có lỗi, đánh dấu Action này là Thất bại (Fail)
        if errors > 0:
            print(f'🚨 CẢNH BÁO: Phát hiện {errors} file bị lỗi!')
            sys.exit(1)
            
        print('✅ Tuyệt vời! Tất cả các file JSON đều hợp chuẩn.')
        "